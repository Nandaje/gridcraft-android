[package]
name = "gridcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "GridCraft Android shell — NativeActivity + eframe (wgpu Vulkan/GLES) + runtime storage permissions & SAF bridge"

[lib]
name = "gridcraft_android"
crate-type = ["cdylib", "rlib"]

# Only the Android JNI/Activity entrypoint (`android_entry.rs`) uses `#[unsafe(no_mangle)]` and JNI
# pointers; every other module in this crate is 100% safe Rust (`unsafe_code = "deny"`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "=0.6.1", default-features = false, features = ["native-activity"] }
jni = "=0.22.4"
ndk = { version = "=0.9.0", default-features = false }
