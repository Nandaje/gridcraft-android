name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-android*"

jobs:
  build-android:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          bash packaging/android/package.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-android-arm64-v8a-apk
          path: dist/release/gridcraft-*-android-arm64-v8a.apk
